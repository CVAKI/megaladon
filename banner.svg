
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030a12"/>
      <stop offset="100%" stop-color="#041a2e"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc00">
        <animate attributeName="stop-color" values="#ffcc00;#ffffff;#ffcc00" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#ffcc00;#ffffff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffcc00">
        <animate attributeName="stop-color" values="#ffcc00;#ffffff;#ffcc00" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="310" fill="url(#bg)"/>

  <!-- Animated light rays -->
  <polygon points="420,0 -60,310 60,310" fill="#ffcc00" opacity="0.04">
    <animate attributeName="opacity" values="0.03;0.09;0.03" dur="4s" repeatCount="indefinite" begin="0s"/>
  </polygon>
  <polygon points="420,0 150,310 280,310" fill="#ffcc00" opacity="0.04">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4s" repeatCount="indefinite" begin="1s"/>
  </polygon>
  <polygon points="420,0 560,310 690,310" fill="#ffffff" opacity="0.04">
    <animate attributeName="opacity" values="0.03;0.09;0.03" dur="4s" repeatCount="indefinite" begin="2s"/>
  </polygon>
  <polygon points="420,0 800,310 940,310" fill="#ffcc00" opacity="0.04">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4s" repeatCount="indefinite" begin="3s"/>
  </polygon>

  <!-- Twinkling stars -->
  <g fill="#ffcc00">
    <circle cx="340" cy="18" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="370" cy="50" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="395" cy="28" r="1.3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.1s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="420" cy="14" r="0.9"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.3s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="450" cy="42" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.9s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="490" cy="22" r="0.8"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.7s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="560" cy="35" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.1s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="610" cy="18" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="670" cy="48" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="1.8s" repeatCount="indefinite" begin="2s"/></circle>
    <circle cx="710" cy="25" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="760" cy="42" r="0.8"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="800" cy="18" r="1"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" begin="0.3s"/></circle>
  </g>

  <!-- Rising bubbles (left zone) -->
  <circle cx="130" cy="300" r="2.8" fill="none" stroke="#ffcc00" stroke-width="0.7">
    <animate attributeName="cy" values="300;40" dur="7s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.55;0" dur="7s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="175" cy="300" r="2" fill="none" stroke="#ffffff" stroke-width="0.6">
    <animate attributeName="cy" values="300;70" dur="5.5s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="opacity" values="0.45;0" dur="5.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="90" cy="300" r="2.2" fill="none" stroke="#ffcc00" stroke-width="0.6">
    <animate attributeName="cy" values="300;90" dur="8s" repeatCount="indefinite" begin="2.8s"/>
    <animate attributeName="opacity" values="0.4;0" dur="8s" repeatCount="indefinite" begin="2.8s"/>
  </circle>
  <circle cx="220" cy="300" r="1.5" fill="none" stroke="#ffffff" stroke-width="0.5">
    <animate attributeName="cy" values="300;60" dur="6s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.35;0" dur="6s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <!-- Rising bubbles (right zone) -->
  <circle cx="500" cy="300" r="2.2" fill="none" stroke="#ffcc00" stroke-width="0.6">
    <animate attributeName="cy" values="300;80" dur="8.5s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="opacity" values="0.3;0" dur="8.5s" repeatCount="indefinite" begin="1.8s"/>
  </circle>
  <circle cx="620" cy="300" r="1.8" fill="none" stroke="#ffffff" stroke-width="0.5">
    <animate attributeName="cy" values="300;110" dur="7s" repeatCount="indefinite" begin="3.5s"/>
    <animate attributeName="opacity" values="0.3;0" dur="7s" repeatCount="indefinite" begin="3.5s"/>
  </circle>
  <circle cx="750" cy="300" r="2" fill="none" stroke="#ffcc00" stroke-width="0.6">
    <animate attributeName="cy" values="300;100" dur="6.5s" repeatCount="indefinite" begin="2.2s"/>
    <animate attributeName="opacity" values="0.25;0" dur="6.5s" repeatCount="indefinite" begin="2.2s"/>
  </circle>

  <!-- ══ SHARK LOGO (left column) ══ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95"/>
    <image x="14" y="30" width="260" height="260" href="data:image/png;base64,${B64}" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Divider with animated glow -->
  <line x1="302" y1="12" x2="302" y2="292" stroke="#ffcc00" stroke-width="0.6">
    <animate attributeName="stroke-opacity" values="0.12;0.35;0.12" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- ══ RIGHT SIDE CONTENT ══ -->

  <!-- "Megaladon" title with animated gradient -->
  <text x="328" y="92" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="52" font-weight="700" fill="url(#tg)" letter-spacing="3">Megaladon</text>

  <!-- Blinking cursor after title -->
  <rect x="810" y="46" width="4" height="52" fill="#ffcc00">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Version + dev badge -->
  <rect x="328" y="104" width="66" height="17" rx="8.5" fill="rgba(255,204,0,0.07)" stroke="#ffcc00" stroke-width="0.6">
    <animate attributeName="stroke-opacity" values="0.35;0.75;0.35" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="361" y="116.5" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.85">v4.0.0</text>

  <rect x="402" y="104" width="96" height="17" rx="8.5" fill="rgba(255,255,255,0.07)" stroke="#ffffff" stroke-width="0.6">
    <animate attributeName="stroke-opacity" values="0.35;0.75;0.35" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
  </rect>
  <text x="450" y="116.5" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ffffff" fill-opacity="0.85">by CVKI  &#x265E;</text>

  <!-- Tagline -->
  <text x="328" y="145" font-family="'Courier New',Courier,monospace" font-size="11" fill="#ffcc00" fill-opacity="0.75" letter-spacing="1.2">AI Terminal  ·  Self-Testing Brain  ·  Memory  ·  Skills</text>

  <!-- Sub-tagline -->
  <text x="328" y="164" font-family="'Courier New',Courier,monospace" font-size="10" fill="#ffffff" fill-opacity="0.6" letter-spacing="0.8">7-Phase Neural Pipeline  ·  Multi-Provider</text>

  <!-- Provider pills with pulse animation -->
  <rect x="328" y="180" width="74" height="18" rx="9" fill="rgba(255,204,0,0.08)" stroke="#ffcc00" stroke-width="0.65">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <text x="365" y="193" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.85">Anthropic</text>

  <rect x="410" y="180" width="82" height="18" rx="9" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="0.65">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <text x="451" y="193" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ffffff" fill-opacity="0.85">OpenRouter</text>

  <rect x="500" y="180" width="48" height="18" rx="9" fill="rgba(255,204,0,0.08)" stroke="#ffcc00" stroke-width="0.65">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <text x="524" y="193" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.85">Groq</text>

  <rect x="556" y="180" width="58" height="18" rx="9" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="0.65">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </rect>
  <text x="585" y="193" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ffffff" fill-opacity="0.85">Ollama</text>

  <!-- Feature bullets -->
  <circle cx="332" cy="220" r="2" fill="#ffcc00" fill-opacity="0.7"/>
  <text x="340" y="224" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.7">Self-Testing Loop</text>
  <circle cx="470" cy="220" r="2" fill="#ffcc00" fill-opacity="0.7"/>
  <text x="478" y="224" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.7">Persistent Memory</text>
  <circle cx="332" cy="238" r="2" fill="#ffcc00" fill-opacity="0.7"/>
  <text x="340" y="242" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.7">Skills System</text>
  <circle cx="470" cy="238" r="2" fill="#ffcc00" fill-opacity="0.7"/>
  <text x="478" y="242" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.7">Shell Passthrough</text>
  <circle cx="332" cy="256" r="2" fill="#ffcc00" fill-opacity="0.7"/>
  <text x="340" y="260" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.7">Folder Scanner</text>
  <circle cx="470" cy="256" r="2" fill="#ffcc00" fill-opacity="0.7"/>
  <text x="478" y="260" font-family="'Courier New',monospace" font-size="9.5" fill="#ffcc00" fill-opacity="0.7">Web Dashboard</text>

  <!-- Ocean wave at bottom -->
  <path d="M0 278 Q210 258 420 278 Q630 298 840 278 L840 310 L0 310Z" fill="#041e36" fill-opacity="0.65"/>
  <path d="M0 291 Q210 273 420 291 Q630 309 840 291 L840 310 L0 310Z" fill="#030a12" fill-opacity="0.9"/>

  <!-- Swaying seaweed -->
  <path d="M44 310 Q38 286 44 264 Q50 243 44 223 Q38 206 44 192" fill="none" stroke="#085041" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-7,44,310;7,44,310;-7,44,310" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M25 310 Q19 290 25 272 Q31 256 25 242 Q19 230 25 218" fill="none" stroke="#0f6e56" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="6,25,310;-6,25,310;6,25,310" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <path d="M795 310 Q789 288 795 268 Q801 250 795 232 Q789 217 795 204" fill="none" stroke="#085041" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="8,795,310;-8,795,310;8,795,310" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <path d="M815 310 Q821 293 815 277 Q809 263 815 250" fill="none" stroke="#0f6e56" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-5,815,310;5,815,310;-5,815,310" dur="3.3s" repeatCount="indefinite"/>
  </path>
</svg>